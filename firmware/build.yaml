# Firmware builds for GitHub Actions (.github/workflows/firmware.yml) and firmware/build.sh.
# Flash keygen_left to the left half and keygen_right to the right; settings_reset clears pairings.
---
include:
  - board: nice_nano//zmk
    shield: keygen_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano//zmk
    shield: keygen_right
  - board: nice_nano//zmk
    shield: settings_reset
  # bring-up: each half lights its LEDs on its own, on battery too, without saving anything
  - board: nice_nano//zmk
    shield: keygen_left
    cmake-args: -DCONFIG_KEYGEN_LIGHTING_TEST=y
    artifact-name: keygen_left-led-test-nice_nano
  - board: nice_nano//zmk
    shield: keygen_right
    cmake-args: -DCONFIG_KEYGEN_LIGHTING_TEST=y
    artifact-name: keygen_right-led-test-nice_nano
