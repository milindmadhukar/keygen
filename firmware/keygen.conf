# Keygen: shared by both halves

# Idle after 30 s: the OLEDs blank and the LEDs go off; Bluetooth stays connected
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep after an hour without USB power; a key press reboots the half and it reconnects.
# Each half times out on its own.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# ZMK's addressable RGB driver runs the 33 per-key LEDs as one strip. Its ext-power (P0.08) enables
# the 5 V boost that supplies them. BRT_MAX caps the PWM at 40 %. The Keygen module
# (module/src/power/battery_lighting.c) alone turns the lighting on and off: off when idle, as set
# on USB, and on battery only if &kg_bl allows it, capped at half the brightness scale, halved
# below 20 % charge and off below 10 %. Whenever the lighting is off it turns the boost off too.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=40

# An EC11 encoder on each half
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# A 0.96 in. SSD1306 OLED on each half: ZMK's status screen (output, Bluetooth profile, layer and
# battery on the left; the right's own battery and link). It blanks when the keyboard goes idle.
CONFIG_ZMK_DISPLAY=y

# Mouse emulation, for the left knob's scroll
CONFIG_ZMK_POINTING=y
