# Keygen: shared by both halves

# Deep sleep after 15 minutes idle; any key wakes the half
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# The 33 per-key LEDs as one strip, powered from the battery through the LED power switch (P0.08,
# ZMK ext-power). They turn off when idle, light only while that half has USB power, and their
# brightness is capped to hold the strip's current down.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=40

# An EC11 encoder on each half
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# A 0.96 in. SSD1306 OLED on each half: ZMK's status screen (output, Bluetooth profile, layer and
# battery on the left; the right's own battery and link). It blanks when the keyboard goes idle.
CONFIG_ZMK_DISPLAY=y

# Mouse emulation, for the left knob's scroll
CONFIG_ZMK_POINTING=y
