# Keygen: shared by both halves

# Deep sleep after 15 minutes idle; any key wakes the half
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# The 33 per-key RGB backlights use ZMK's "underglow" driver because it controls addressable RGB
# strips; there are no LEDs under the case. P0.08 drives the LED rail's power MOSFET. This 40%
# ceiling limits current, but ZMK's USB auto-off code overrides ON_START at boot and its ext-power
# driver starts enabled. Its USB and idle auto-off handlers also share one state, so a wake can
# restore LEDs on battery. Correct and measure this during bring-up (see docs/logic-audit.md).
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=40

# An EC11 encoder on each half
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# A 0.96 in. SSD1306 OLED on each half: ZMK's status screen (output, Bluetooth profile, layer and
# battery on the left; the right's own battery and link). It blanks when the keyboard goes idle.
CONFIG_ZMK_DISPLAY=y

# Mouse emulation, for the left knob's scroll
CONFIG_ZMK_POINTING=y
