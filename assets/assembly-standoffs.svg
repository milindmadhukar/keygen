<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Switch, foam, plate, PCB and standoff in one section</title>
  <desc id="desc">At left an MX switch clips into the 1.5 millimetre plate. Two metal contacts and three plastic locating posts descend into five matching PCB holes; the metal contacts reach the hot-swap socket on the PCB back. The 2 millimetre EVA plate foam is taped under the plate, 1 millimetre above the 0.5 millimetre Poron ring on the PCB. At right a 3 millimetre standoff on a 0.5 millimetre shim separates the plate and PCB, held by one M2 by 5 screw from below; nothing screws into it from above.</desc>
  <style>
    text { font-family: DejaVu Sans, Arial, sans-serif; fill: #182234; }
    .title { font-size: 27px; font-weight: 700; }
    .head { font-size: 19px; font-weight: 700; }
    .lab { font-size: 16px; }
    .small { font-size: 14px; }
    .white { fill: #fff; }
    .plate { fill: #acd6e5; stroke: #315b73; stroke-width: 2; }
    .pcb { fill: #397765; stroke: #174a3c; stroke-width: 2; }
    .eva { fill: #626a76; stroke: #454c57; stroke-width: 1.5; }
    .ring { fill: #9296a5; stroke: #606675; stroke-width: 1.5; }
    .brass { fill: #d9a143; stroke: #8a5c16; stroke-width: 2; }
    .screw { fill: #718096; stroke: #344054; stroke-width: 2; }
    .switch { fill: #bd9ecb; stroke: #6a4879; stroke-width: 2; }
    .plastic { fill: #bba2c6; stroke: #6a4879; stroke-width: 1.5; }
    .metal { fill: #d89e4d; stroke: #895d25; stroke-width: 1.5; }
    .dash { stroke: #a0acba; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .dim { stroke: #182234; stroke-width: 1.2; }
  </style>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="35" y="45" class="title">The switch and standoff share the 3.5 mm plate-to-PCB gap</text>
  <text x="35" y="75" class="lab">Section, heights to scale (30 px per mm). Pin positions are grouped to show all five; the footprint sets where they are.</text>
  <text x="90" y="125" class="head">At a switch</text>
  <text x="730" y="125" class="head">At a mounting hole (all ten the same)</text>

  <!-- Heights: plate 240..285 (1.5), EVA 285..345 (2.0), air 345..375 (1.0), ring/shim 375..390 (0.5), PCB 390..438 (1.6). -->
  <path class="dash" d="M65 240 H1135 M65 285 H1135 M65 390 H1135 M65 438 H1135"/>

  <!-- A switch clips into the plate. -->
  <rect class="plate" x="90" y="240" width="205" height="45" rx="3"/>
  <rect class="plate" x="545" y="240" width="155" height="45" rx="3"/>
  <rect class="switch" x="280" y="200" width="280" height="40" rx="5"/>
  <rect class="switch" x="307" y="240" width="226" height="45" rx="3"/>
  <rect class="switch" x="325" y="285" width="190" height="105" rx="4"/>
  <rect class="switch" x="394" y="160" width="54" height="40" rx="4"/>
  <path class="switch" d="M307 285 L295 300 L325 312 Z"/>
  <path class="switch" d="M533 285 L545 300 L515 312 Z"/>
  <text x="314" y="226" class="lab">switch housing clips to plate</text>
  <text x="99" y="270" class="lab">1.5 mm plate</text>
  <text x="552" y="270" class="small">14 × 14 mm cut-out</text>

  <!-- Plate foam taped under the plate, notched where the latches spring out. Ring on the PCB. -->
  <rect class="eva" x="90" y="285" width="190" height="60"/>
  <rect class="eva" x="560" y="285" width="140" height="60"/>
  <rect class="ring" x="260" y="375" width="35" height="15"/>
  <rect class="ring" x="545" y="375" width="35" height="15"/>
  <text x="98" y="310" class="small white">2.0 mm EVA plate foam,</text>
  <text x="98" y="331" class="small white">taped under the plate</text>
  <text x="98" y="366" class="small">1.0 mm air</text>
  <text x="566" y="320" class="small white">EVA</text>

  <!-- Pins and PCB. The 2 metal pins reach the socket below, 3 plastic locating posts enter holes. -->
  <rect class="plastic" x="340" y="390" width="13" height="43" rx="3"/>
  <rect class="plastic" x="412" y="390" width="17" height="44" rx="3"/>
  <rect class="plastic" x="487" y="390" width="13" height="43" rx="3"/>
  <rect class="metal" x="375" y="390" width="12" height="68" rx="2"/>
  <rect class="metal" x="458" y="390" width="12" height="68" rx="2"/>
  <rect class="pcb" x="90" y="390" width="230" height="48" rx="2"/>
  <rect class="pcb" x="515" y="390" width="185" height="48" rx="2"/>
  <text x="99" y="421" class="lab white">PCB, 1.6 mm</text>
  <rect x="354" y="438" width="138" height="39" rx="4" fill="#38475b"/>
  <text x="109" y="503" class="lab">3 plastic posts enter PCB holes; 2 metal contacts</text>
  <text x="109" y="527" class="lab">pass through into the hotswap socket on its back.</text>
  <text x="109" y="556" class="small">Switch pins plug in; they are not soldered.</text>
  <text x="109" y="578" class="small">The foam's switch cut-out is notched where the latches</text>
  <text x="109" y="597" class="small">spring out under the plate. 0.5 mm Poron ring on the PCB.</text>

  <!-- Mounting hole: standoff on shim, one M2 x 5 from below, its tip 0.1 mm under the standoff top. -->
  <rect class="plate" x="730" y="240" width="405" height="45" rx="3"/>
  <rect x="918" y="240" width="30" height="45" fill="#f8fafc" stroke="#315b73" stroke-width="1"/>
  <rect class="eva" x="730" y="285" width="140" height="60"/>
  <rect class="eva" x="996" y="285" width="139" height="60"/>
  <rect class="brass" x="896" y="285" width="74" height="90" rx="5"/>
  <rect class="brass" x="882" y="375" width="102" height="15" rx="2"/>
  <rect class="pcb" x="730" y="390" width="405" height="48" rx="2"/>
  <rect class="screw" x="924" y="288" width="18" height="150" rx="3"/>
  <rect class="screw" x="907" y="438" width="52" height="33" rx="10"/>
  <text x="1000" y="268" class="small">2.2 mm plate hole</text>
  <text x="738" y="370" class="small">foam cut clear</text>
  <text x="1000" y="365" class="lab">3.0 mm standoff</text>
  <text x="1000" y="386" class="small">0.5 mm shim</text>
  <text x="968" y="462" class="lab">M2 × 5 button head</text>
  <text x="751" y="510" class="small">The screw fills 2.9 mm of the standoff's 3 mm thread;</text>
  <text x="751" y="530" class="small">its tip stops 0.1 mm under the standoff top.</text>
  <text x="751" y="556" class="small">Nothing screws in from above: the standoff bears</text>
  <text x="751" y="576" class="small">on the plate, and the switches hold plate to PCB.</text>

  <!-- 3.5 mm dimension -->
  <path class="dim" d="M1150 285 V390 M1142 285 H1158 M1142 390 H1158"/>
  <text x="1160" y="343" class="small">3.5</text>

  <rect x="140" y="620" width="920" height="59" rx="9" fill="#e5ecf4"/>
  <text x="169" y="646" class="lab">PCB top → plate underside: 3.5 mm = 0.5 mm shim + 3.0 mm standoff.</text>
  <text x="169" y="668" class="lab">At the switch: 0.5 mm Poron + 1.0 mm air + 2.0 mm EVA under the plate = 3.5 mm.</text>
</svg>
